name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: qwen
      HF_HUB_OFFLINE: "1"
      ACROBUILD_REFRESH_INDEX_ON_STARTUP: "false"
      ACROBUILD_WARM_LOCAL_AI_MODELS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements/dev.txt
      - run: python -m pytest -q -p no:cacheprovider
      - run: ruff check .
      - run: mypy
      # These accepted exceptions are documented in requirements/SECURITY_ADVISORIES.md.
      # Keep IDs explicit so any newly reported advisory still fails CI.
      - name: Audit Python dependencies
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2024-227
          --ignore-vuln PYSEC-2024-228
          --ignore-vuln PYSEC-2024-229
          --ignore-vuln PYSEC-2025-40
          --ignore-vuln PYSEC-2025-211
          --ignore-vuln PYSEC-2025-212
          --ignore-vuln PYSEC-2025-213
          --ignore-vuln PYSEC-2025-214
          --ignore-vuln PYSEC-2025-215
          --ignore-vuln PYSEC-2025-216
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2025-218
          --ignore-vuln PYSEC-2026-1325
          --ignore-vuln PYSEC-2026-1977
          --ignore-vuln PYSEC-2026-1980
          --ignore-vuln PYSEC-2026-1981
          --ignore-vuln PYSEC-2026-1982
          --ignore-vuln PYSEC-2026-1983
          --ignore-vuln PYSEC-2026-1984
          --ignore-vuln PYSEC-2026-1985
          --ignore-vuln PYSEC-2026-1986
          --ignore-vuln PYSEC-2026-1987
          --ignore-vuln PYSEC-2026-1988
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3804
          --ignore-vuln PYSEC-2026-3929
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --omit=dev
