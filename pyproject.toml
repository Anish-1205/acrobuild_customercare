[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "qwen-env", "node_modules"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
files = ["services/migration_service.py", "services/intent_service.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
